<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca</title>
</head>
<body>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Caacupe+One&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Michroma&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            background: linear-gradient(to bottom, #1d60fd, #0ef98b);
            min-height: 100vh;
            text-align: center;
            font-family: "JetBrains Mono", monospace;
        }
        input{
            width: 300px;
            height: 30px;
            border-radius: 5px;
            border: 0;
            color: black;
            outline: none;
            padding-left: 5px
        }
        button{
            border: 0;
            height: 30px;
            width: 50px;
            border-radius: 5px;
            transition: 0.4s ease-in-out;
            padding: 5px;
            padding-left: 5px;
        }
    </style>
    <h1>JOGO DA FORCA</h1>
    <h2>TESTE SUA INTUIÇÃO!</h2>
    <h4 id="saidaPalavraOculta">Palavra: </h4>
    <h3 id="saidaTentativas">Tentativas: </h3>
    <svg id="boneco" width="150" height="200" viewBox="0 0 150 200">
    <!-- forca (sempre visível) -->
    <line x1="10" y1="190" x2="110" y2="190" stroke="black" stroke-width="3"/>
    <line x1="30" y1="190" x2="30" y2="10" stroke="black" stroke-width="3"/>
    <line x1="30" y1="10" x2="90" y2="10" stroke="black" stroke-width="3"/>
    <line x1="90" y1="10" x2="90" y2="35" stroke="black" stroke-width="3"/>

    <!-- partes do boneco (começam escondidas) -->
    <circle id="cabeca" cx="90" cy="50" r="15" stroke="black" stroke-width="3" fill="none" style="display:none"/>
    <line id="corpo" x1="90" y1="65" x2="90" y2="120" stroke="black" stroke-width="3" style="display:none"/>
    <line id="bracoEsq" x1="90" y1="80" x2="65" y2="100" stroke="black" stroke-width="3" style="display:none"/>
    <line id="bracoDir" x1="90" y1="80" x2="115" y2="100" stroke="black" stroke-width="3" style="display:none"/>
    <line id="pernaEsq" x1="90" y1="120" x2="70" y2="155" stroke="black" stroke-width="3" style="display:none"/>
    <line id="pernaDir" x1="90" y1="120" x2="110" y2="155" stroke="black" stroke-width="3" style="display:none"/>
</svg>
<br>
    <input type="text" maxlength="1" id="inpChute">
    <button type="submit" id="btnEnviar">Enviar</button>
    <p id="saidaDescartados"></p>
    <p id="status"></p>
    <script src="scripte.js"></script>
</body>
</html>
